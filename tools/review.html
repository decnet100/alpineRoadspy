<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>alpineRoadspy – Prüfen</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; color: #222; }
  #app { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100vh; }
  #side { display: flex; flex-direction: column; border-right: 1px solid #bbb; min-height: 0; }
  #filters { padding: 6px 8px; border-bottom: 1px solid #ddd; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  #filters label { white-space: nowrap; }
  #progress { padding: 4px 8px; color: #555; border-bottom: 1px solid #ddd; }
  #list { flex: 1; overflow: auto; }
  .item { padding: 4px 8px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .item:hover { background: #f3f8ff; }
  .item.sel { background: #ffeaa0; }
  .item .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .item .lbl { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .item .st { color: #2e7d32; font-weight: 600; }
  .item.uncertain .lbl { color: #888; }
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #top { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 8px; padding: 8px; border-bottom: 1px solid #ddd; }
  video { width: 100%; max-height: 46vh; background: #000; display: block; }
  #vbar { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  #images { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; overflow: auto; max-height: 52vh; }
  #images img { max-height: 160px; max-width: 100%; background: #000; cursor: zoom-in; border: 1px solid #ccc; }
  #form { padding: 8px 12px; overflow: auto; flex: 1; }
  h3 { margin: 0 0 6px; font-size: 15px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .opt { border: 1px solid #aaa; border-radius: 4px; padding: 5px 10px; background: #f7f7f7; cursor: pointer; }
  .opt.on { background: #1565c0; color: #fff; border-color: #1565c0; }
  .opt kbd { opacity: .7; margin-right: 4px; }
  .sugg { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .chip { border: 1px solid #bbb; border-radius: 4px; padding: 3px; width: 108px; cursor: pointer; text-align: center; font-size: 11px; background: #fff; }
  .chip img { height: 48px; display: block; margin: 0 auto 2px; }
  .chip.on { outline: 3px solid #1565c0; }
  .field { margin: 6px 0; }
  .field label { display: block; color: #555; font-size: 12px; margin-bottom: 2px; }
  .field input, .field textarea { font: inherit; width: 100%; box-sizing: border-box; padding: 3px 5px; }
  .field textarea { height: 4.5em; font-family: ui-monospace, monospace; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; padding: 4px 10px; border: 1px solid #aaa; border-radius: 3px; background: #f4f4f4; cursor: pointer; }
  button.primary { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  #status { padding: 4px 8px; color: #555; border-top: 1px solid #ddd; min-height: 1.3em; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
  #zoom img { max-width: 96vw; max-height: 96vh; }
  kbd { border: 1px solid #bbb; border-radius: 3px; padding: 0 3px; background: #fafafa; font-size: 11px; color: #222; }
  .hint { color: #666; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div id="filters"></div>
    <div id="progress"></div>
    <div id="list"></div>
    <div id="status"></div>
  </div>
  <div id="main">
    <div id="top">
      <div>
        <video id="video" preload="auto" muted playsinline></video>
        <div id="vbar">
          <button id="bBefore" title="Stelle kurz davor">⏮ Anfang</button>
          <button id="bPlay" title="Leertaste">▶</button>
          <label><input id="loop" type="checkbox"> Abschnitt in Schleife</label>
          <span id="vtime"></span>
          <a id="pickerLink" target="_blank">im Fixpunkt-Tool öffnen</a>
        </div>
      </div>
      <div id="images"></div>
    </div>
    <div id="form"></div>
  </div>
</div>
<div id="zoom"><img alt=""></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const video = $('video');
const params = new URLSearchParams(location.search);
const videoUrl = params.get('video');                       // e.g. /videos/samnaun_work.mp4
const stem = decodeURIComponent((videoUrl || '').split('/').pop()).replace(/\.[^.]+$/, '');
const OBJ = `/data/objects/${stem}`, SIGNS = `/data/signs/${stem}`, SAVE = `data/review/${stem}.json`;

// What can be decided per kind; key = digit on the keyboard. Value 'no' means: detection is wrong.
const KINDS = {
  tunnel:    { label: 'Tunnel', colour: '#455a64', question: 'Auskleidung',
               options: [['1', 'concrete', 'Beton'], ['2', 'rock', 'Naturstein / Fels'], ['3', 'shotcrete', 'Spritzbeton'],
                         ['4', 'mixed', 'gemischt'], ['0', 'no', 'kein Tunnel']], fields: ['name', 'note'] },
  guardrail: { label: 'Leitschiene', colour: '#ff6d00', question: 'Was ist es?',
               options: [['1', 'guardrail', 'Leitschiene'], ['2', 'concrete_barrier', 'Betonleitwand'], ['3', 'wall', 'Mauer / Wand'],
                         ['4', 'rock_face', 'Felswand'], ['0', 'no', 'nichts davon']], fields: ['note'] },
  barrier:   { label: 'Barriere / Wand', colour: '#8d6e63', question: 'Was ist es?',
               options: [['1', 'guardrail', 'Leitschiene'], ['2', 'concrete_barrier', 'Betonleitwand'], ['3', 'wall', 'Mauer / Wand'],
                         ['4', 'rock_face', 'Felswand'], ['0', 'no', 'nichts davon']], fields: ['note'] },
  pole:      { label: 'Pfosten', colour: '#d500f9', question: 'Was ist es?',
               options: [['1', 'delineator', 'Leitpflock'], ['2', 'snow_pole', 'Schneestange'], ['3', 'other_post', 'anderer Pfosten / Mast'],
                         ['0', 'no', 'kein Pfosten']], fields: ['note'] },
  light:     { label: 'Leuchte', colour: '#00acc1', question: 'Was ist es?',
               options: [['1', 'street_light', 'Straßenlaterne'], ['2', 'tunnel_light', 'Tunnelleuchte'], ['0', 'no', 'keine Leuchte']],
               fields: ['note'] },
  sign:      { label: 'Schild', colour: '#ffb300', question: 'Zeichen (Ziffer = Vorschlag)', options: [['0', 'no', 'kein Schild']],
               fields: ['code', 'value', 'text_lines', 'names', 'destinations', 'note'] },
};
const FIELD_LABELS = {
  name: 'Name (z. B. Tunnelname)', note: 'Notiz', code: 'Zeichen-Code (OSM-Schema, z. B. AT:52.10a, CH:2.30)',
  value: 'Wert (Tempo, Gewicht, Höhe …)', text_lines: 'Text genau wie aufgedruckt – eine Zeile pro Zeile',
  names: 'Namen je Sprache – eine Zeile „de: Samnaun“', destinations: 'Ziele (Wegweiser) – eine Zeile „Martina | 5 | 27 | →“',
};
const TEXTAREAS = new Set(['text_lines', 'names', 'destinations']);

const state = { items: [], review: { meta: { video: videoUrl }, items: {} }, sel: -1, catalog: new Map(), dirty: false };

function status(msg) { $('status').textContent = msg; }
async function getJson(url) { const r = await fetch(url); if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.json(); }
async function getText(url) { const r = await fetch(url); if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.text(); }

function parseCsv(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { field += '"'; i++; } else if (c === '"') q = false; else field += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(field); field = ''; if (row.some(Boolean)) rows.push(row); row = []; }
    else field += c;
  }
  row.push(field); if (row.some(Boolean)) rows.push(row);
  const head = rows.shift();
  return rows.map((r) => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}

const catalogImage = (file) => file ? 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(file.replace(/ /g, '_')) + '?width=96' : '';

// ---------- loading ----------

async function load() {
  if (!videoUrl) { status('Aufruf mit ?video=/videos/<name>.mp4'); return; }
  video.src = videoUrl;
  $('pickerLink').href = `fix_picker.html?video=${encodeURIComponent(videoUrl)}`;
  const gj = await getJson(`${OBJ}/objects.geojson`);
  let signs = {};
  try { (await getJson(`${SIGNS}/signs.json`)).signs.forEach((s) => { signs[s.id] = s; }); } catch (e) { /* signs.py not run */ }
  try { parseCsv(await getText('/catalog/signs.csv')).forEach((r) => { if (!state.catalog.has(r.code)) state.catalog.set(r.code, r); }); } catch (e) { /* no catalog */ }
  try { state.review = await getJson('/' + SAVE); state.review.items = state.review.items || {}; } catch (e) { /* first time */ }

  for (const f of gj.features) {
    const p = f.properties, kind = p.kind;
    if (!KINDS[kind] || !p.id) continue;
    const item = { id: p.id, kind, cls: p.class, side: p.side, uncertain: p.status === 'uncertain', reasons: p.reasons };
    if (f.geometry.type === 'Point') {
      // start a few seconds before passing: signs and posts are seen well before
      Object.assign(item, { t0: p.video_time_s - 3, t1: p.video_time_s + 0.5, station: p.station_m,
                            images: [`${OBJ}/thumbs/${p.id}.jpg`] });
    } else {
      Object.assign(item, { t0: p.video_time_s, t1: p.time_to_s, station: p.station_from_m, stationTo: p.station_to_m,
                            images: (p.thumbs || []).map((t) => `${OBJ}/thumbs/${t}`) });
    }
    if (kind === 'sign' && signs[p.id]) {
      item.images = signs[p.id].crops.map((c) => `${SIGNS}/${c}`).concat(item.images);
      item.suggestions = signs[p.id].suggestions || [];
      item.reading = signs[p.id].reading;
    }
    state.items.push(item);
  }
  state.items.sort((a, b) => a.t0 - b.t0);
  buildFilters();
  renderList();
  selectNext(-1);
  status(`${state.items.length} Elemente geladen` + (Object.keys(signs).length ? `, davon ${Object.keys(signs).length} Schilder mit Vorschlägen` : ''));
}

// ---------- list ----------

function buildFilters() {
  const counts = {};
  state.items.forEach((it) => { counts[it.kind] = (counts[it.kind] || 0) + 1; });
  const saved = JSON.parse(localStorage.getItem('review:filters') || '{}');
  $('filters').innerHTML = Object.entries(KINDS).filter(([k]) => counts[k]).map(([k, d]) =>
    `<label><input type="checkbox" data-kind="${k}" ${saved[k] === false ? '' : 'checked'}> ${d.label} (${counts[k]})</label>`).join('') +
    `<label><input type="checkbox" id="fOpen" ${saved.open ? 'checked' : ''}> nur offene</label>
     <label><input type="checkbox" id="fUnc" ${saved.unc === false ? '' : 'checked'}> unsichere zeigen</label>`;
  $('filters').querySelectorAll('input').forEach((i) => i.onchange = () => {
    const f = {}; $('filters').querySelectorAll('input[data-kind]').forEach((x) => { f[x.dataset.kind] = x.checked; });
    f.open = $('fOpen').checked; f.unc = $('fUnc').checked;
    localStorage.setItem('review:filters', JSON.stringify(f));
    renderList();
  });
}

function visible(it) {
  const box = $('filters').querySelector(`input[data-kind="${it.kind}"]`);
  if (box && !box.checked) return false;
  if ($('fOpen').checked && state.review.items[it.id]?.done) return false;
  if (!$('fUnc').checked && it.uncertain) return false;
  return true;
}

function itemLabel(it) {
  const r = state.review.items[it.id];
  const where = it.stationTo != null ? `${Math.round(it.station)}–${Math.round(it.stationTo)} m` : `${Math.round(it.station)} m`;
  const side = it.side && it.side !== 'both' ? ` ${it.side === 'left' ? 'L' : 'R'}` : '';
  let decided = '';
  if (r?.choice) {
    const opt = KINDS[it.kind].options.find((o) => o[1] === r.choice);
    decided = opt ? opt[2] : r.choice;
  } else if (r?.code) decided = r.code;
  return { text: `${it.id} · ${KINDS[it.kind].label} · ${where}${side}`, decided };
}

function renderList() {
  const list = $('list');
  list.innerHTML = '';
  let done = 0, shown = 0;
  state.items.forEach((it, i) => {
    if (state.review.items[it.id]?.done) done++;
    if (!visible(it)) return;
    shown++;
    const { text, decided } = itemLabel(it);
    const div = document.createElement('div');
    div.className = 'item' + (i === state.sel ? ' sel' : '') + (it.uncertain ? ' uncertain' : '');
    div.dataset.idx = i;
    div.innerHTML = `<span class="dot" style="background:${KINDS[it.kind].colour}"></span><span class="lbl"></span><span class="st"></span>`;
    div.querySelector('.lbl').textContent = text;
    div.querySelector('.st').textContent = state.review.items[it.id]?.done ? '✓ ' + decided : '';
    div.onclick = () => select(i);
    list.appendChild(div);
  });
  $('progress').textContent = `${done} von ${state.items.length} geprüft · ${shown} angezeigt`;
}

function selectNext(dir) {
  const n = state.items.length;
  for (let k = 1; k <= n; k++) {
    const i = dir >= 0 ? state.sel + k : state.sel - k;
    if (i < 0 || i >= n) break;
    if (visible(state.items[i])) { select(i); return; }
  }
}

// ---------- detail ----------

function select(i) {
  state.sel = i;
  const it = state.items[i];
  renderList();
  document.querySelector('.item.sel')?.scrollIntoView({ block: 'nearest' });
  video.pause();
  video.currentTime = Math.max(0, it.t0);
  $('images').innerHTML = '';
  it.images.forEach((src) => {
    const img = new Image();
    img.src = src;
    img.onerror = () => img.remove();
    img.onclick = () => { $('zoom').querySelector('img').src = src; $('zoom').style.display = 'flex'; };
    $('images').appendChild(img);
  });
  renderForm(it);
}

function renderForm(it) {
  const def = KINDS[it.kind];
  const r = state.review.items[it.id] || {};
  const form = $('form');
  const where = it.stationTo != null ? `Station ${Math.round(it.station)}–${Math.round(it.stationTo)} m (${Math.round(it.stationTo - it.station)} m)`
                                     : `Station ${Math.round(it.station)} m`;
  form.innerHTML = `<h3>${it.id} – ${def.label}${it.cls && it.cls !== it.kind ? ` (${it.cls})` : ''}</h3>
    <div class="hint">${where}${it.side && it.side !== 'both' ? ' · ' + (it.side === 'left' ? 'links' : 'rechts') : ''}
      ${it.uncertain ? ' · <b>unsicher</b>: ' + (it.reasons || '') : ''}</div>
    <div class="hint" style="margin-top:4px">${def.question}:</div>
    <div class="opts" id="opts"></div><div id="extra"></div>
    <button class="primary" id="bDone">✓ Erledigt, weiter (Enter)</button>
    <button id="bUndo">offen lassen</button>
    <span class="hint"> · <kbd>↓</kbd>/<kbd>↑</kbd> nächstes/voriges · <kbd>Leertaste</kbd> Video · Ziffern wählen</span>`;
  def.options.forEach(([key, value, label]) => {
    const b = document.createElement('span');
    b.className = 'opt' + (r.choice === value ? ' on' : '');
    b.innerHTML = `<kbd>${key}</kbd>${label}`;
    b.onclick = () => choose(it, value);
    $('opts').appendChild(b);
  });
  const extra = $('extra');
  if (it.kind === 'sign') {
    const sugg = document.createElement('div');
    sugg.className = 'sugg';
    (it.suggestions || []).forEach((s, k) => {
      const c = document.createElement('div');
      c.className = 'chip' + (r.code === s.code ? ' on' : '');
      c.innerHTML = `<img src="${catalogImage(s.file)}" alt=""><b>${k + 1}</b> ${s.code}<br>${s.name}`;
      c.onclick = () => setField(it, 'code', s.code, true);
      sugg.appendChild(c);
    });
    if (!(it.suggestions || []).length) sugg.innerHTML = '<span class="hint">keine Vorschläge (tools/signs.py nicht gelaufen) – Code eintippen</span>';
    extra.appendChild(sugg);
  }
  const grid = document.createElement('div');
  grid.className = 'row';
  def.fields.forEach((name) => {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    wrap.innerHTML = `<label>${FIELD_LABELS[name]}</label>`;
    const input = document.createElement(TEXTAREAS.has(name) ? 'textarea' : 'input');
    input.value = r[name] ?? prefill(it, name) ?? '';
    if (name === 'code') {
      input.setAttribute('list', 'catalogCodes');
      const known = state.catalog.get(r.code);
      if (known) wrap.querySelector('label').textContent += ` – ${known.name}`;
    }
    input.oninput = () => setField(it, name, input.value, false);
    wrap.appendChild(input);
    grid.appendChild(wrap);
  });
  extra.appendChild(grid);
  $('bDone').onclick = () => markDone(it, true);
  $('bUndo').onclick = () => markDone(it, false);
}

// suggestions from the vision-language model (signs.py --vlm) as starting values
function prefill(it, name) {
  const g = it.reading;
  if (!g || it.kind !== 'sign') return null;
  if (name === 'value' && g.value != null) return String(g.value);
  if (name === 'text_lines' && g.text_lines) return g.text_lines.join('\n');
  if (name === 'names' && g.names) return Object.entries(g.names).map(([k, v]) => `${k}: ${v}`).join('\n');
  if (name === 'destinations' && g.destinations) {
    return g.destinations.map((d) => [(d.lines || []).join(' / '), d.km ?? '', d.ref ?? '', d.arrow ?? ''].join(' | ')).join('\n');
  }
  if (name === 'code' && g.code && g.code !== 'other' && g.code !== 'no_sign') return g.code;
  return null;
}

function entry(it) {
  return state.review.items[it.id] || (state.review.items[it.id] = { kind: it.kind });
}

function choose(it, value) {
  const r = entry(it);
  r.choice = r.choice === value ? undefined : value;
  touch();
  renderForm(it);
  renderList();
}

function setField(it, name, value, rerender) {
  entry(it)[name] = value;
  touch();
  if (rerender) { renderForm(it); renderList(); }
}

function markDone(it, done) {
  const r = entry(it);
  // keep pre-filled sign values when confirming
  if (done && it.kind === 'sign') {
    for (const name of KINDS.sign.fields) if (r[name] == null && prefill(it, name) != null) r[name] = prefill(it, name);
  }
  r.done = done;
  r.at = new Date().toISOString();
  touch();
  renderList();
  if (done) selectNext(1); else renderForm(it);
}

// ---------- saving / export ----------

let saveTimer = null;
function touch() { state.dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(save, 700); }

async function save() {
  state.review.meta = Object.assign(state.review.meta || {}, { video: videoUrl, saved: new Date().toISOString() });
  try {
    const res = await fetch(`/api/save?path=${encodeURIComponent(SAVE)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Alpineroadspy': '1' },
      body: JSON.stringify(state.review, null, 1),
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error);
    state.dirty = false;
    status(`gespeichert: ${out.saved}`);
  } catch (err) {
    status(`Speichern fehlgeschlagen: ${err.message}`);
  }
}
window.addEventListener('beforeunload', (e) => { if (state.dirty) { save(); e.preventDefault(); } });

// ---------- video ----------

function togglePlay() { video.paused ? video.play() : video.pause(); }
$('bPlay').onclick = togglePlay;
$('bBefore').onclick = () => { const it = state.items[state.sel]; if (it) video.currentTime = Math.max(0, it.t0); };
video.addEventListener('play', () => { $('bPlay').textContent = '⏸'; });
video.addEventListener('pause', () => { $('bPlay').textContent = '▶'; });
video.addEventListener('timeupdate', () => {
  $('vtime').textContent = `${video.currentTime.toFixed(1)} s`;
  const it = state.items[state.sel];
  if (it && $('loop').checked && video.currentTime > it.t1) video.currentTime = Math.max(0, it.t0);
});
$('zoom').onclick = () => { $('zoom').style.display = 'none'; };

document.addEventListener('keydown', (e) => {
  const tag = e.target.tagName;
  if (e.key === 'Escape') { e.target.blur?.(); $('zoom').style.display = 'none'; return; }
  if (tag === 'INPUT' && e.target.type !== 'checkbox' || tag === 'TEXTAREA') {
    if (e.key === 'Enter' && tag === 'INPUT' && state.sel >= 0) { e.preventDefault(); e.target.blur(); markDone(state.items[state.sel], true); }
    return;
  }
  const it = state.items[state.sel];
  if (e.key === 'ArrowDown' || e.key === 'j') { selectNext(1); e.preventDefault(); return; }
  if (e.key === 'ArrowUp' || e.key === 'k') { selectNext(-1); e.preventDefault(); return; }
  if (e.key === ' ') { togglePlay(); e.preventDefault(); return; }
  if (!it) return;
  if (e.key === 'Enter') { markDone(it, true); e.preventDefault(); return; }
  if (/^[0-9]$/.test(e.key)) {
    const opt = KINDS[it.kind].options.find((o) => o[0] === e.key);
    if (opt) { choose(it, opt[1]); }
    else if (it.kind === 'sign' && it.suggestions && it.suggestions[+e.key - 1]) setField(it, 'code', it.suggestions[+e.key - 1].code, true);
    e.preventDefault();
  }
});

// catalog codes for the sign code field
const dl = document.createElement('datalist');
dl.id = 'catalogCodes';
document.body.appendChild(dl);
load().then(() => {
  dl.innerHTML = [...state.catalog.values()].map((r) => `<option value="${r.code}">${r.name}</option>`).join('');
}).catch((err) => status(`Fehler beim Laden: ${err.message} – zuerst tools/track.py laufen lassen`));
</script>
</body>
</html>
