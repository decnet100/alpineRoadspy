[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpineroadspy"
version = "0.0.1"
description = "Semi-automatic detection of roadside features from video drives on alpine roads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "shapely>=2",
    "geopandas",
    "pyogrio",
    "pyproj",
]

[project.optional-dependencies]
detect = ["ultralytics"]
terrain = ["rasterio"]

[tool.setuptools.packages.find]
where = ["src"]
